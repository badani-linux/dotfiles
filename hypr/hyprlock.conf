# =============================================================================
# Hyprlock Catppuccin Mocha Lock Screen Layout
# =============================================================================

source = ~/.config/hypr/mocha.conf

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot # Dynamically grabs your open wallpaper state
    blur_passes = 3   # Frosted glass background layer effect
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
}

# The Live Time Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User Welcoming Prompt
label {
    monitor =
    text = Welcome back, $USER
    color = $subtext0
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Interactive Password Input Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    # Styling colors linked to Catppuccin Mocha definitions
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    
    # Validation state monitoring color shifts
    check_color = $sapphire
    fail_color = $red

    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false

    position = 0, -40
    halign = center
    valign = center
}
