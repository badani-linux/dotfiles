# =============================================================================
# Hypridle Management Protocol Profile
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock     # Prevents firing multiple window threads
    before_sleep_cmd = loginctl lock-session  # Force session locks on laptops lid closures
    after_sleep_cmd = hyprctl dispatch dpms on # Restores panel outputs clean on wake
}

# 1. Dim the backlight slightly after 2.5 minutes of inactivity
listener {
    timeout = 150                                
    on-timeout = brightnessctl -s set 10         
    on-resume = brightnessctl -r                
}

# 2. Lock the desktop completely after 5 minutes of inactivity
listener {
    timeout = 300                                
    on-timeout = loginctl lock-session           
}

# 3. Turn off monitor signals completely after 5.5 minutes
listener {
    timeout = 330                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}

# 4. Suspend the machine to RAM after 10 minutes of complete inactivity
listener {
    timeout = 600                                
    on-timeout = systemctl suspend               
}
